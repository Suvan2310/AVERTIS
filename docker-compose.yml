version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avertis_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./avertis.db
      - THRESHOLD_LOW=25.0
      - THRESHOLD_MODERATE=50.0
      - THRESHOLD_HIGH=75.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avertis_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
